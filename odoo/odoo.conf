[options]
; Database settings
db_host = localhost
db_port = 5432
db_user = odoo
db_password = odoo
db_name = {PROJECT}-{VERSION}

; Database filter - matches project-version or project-version-anything
db_filter = ^{PROJECT}-{VERSION}(-.*)?$

; File storage
data_dir = ~/.odoo

; Addons
addons_path = ~/Developer/odoo/versions/{VERSION}/addons,~/Developer/odoo/versions/{VERSION}+e,{PROJECT_PATH}
init = base

; SMTP
smtp_server = localhost
smtp_port = 1025
smtp_encryption = none

; Logging
logfile = /tmp/odoo.log
log_level = info
log_db = False

; Development
workers = 0
without_demo = False
dev_mode = watchdog
